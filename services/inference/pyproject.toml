[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beacon-inference"
version = "0.1.0"
description = "Shared open-vocabulary perception for phone camera feeds"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pillow>=11,<13", "pydantic-settings>=2.8,<3"]

[project.optional-dependencies]
yolo = [
    "ultralytics>=8.3.0,<9",
    "clip @ git+https://github.com/ultralytics/CLIP.git@a13192f8cb767260d7dfd98c843b0716593169e7",
    "torch>=2.7,<2.11",
    "torchvision>=0.22,<0.26",
]
sam3 = ["transformers>=5.0,<6", "torch>=2.7,<3", "torchvision>=0.22,<1"]
reid = [
    "huggingface-hub>=1,<2",
    "torch>=2.7,<2.11",
    "torchvision>=0.22,<0.26",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "httpx2>=2.13.0",
    "anyio<4.15",
]

[project.scripts]
beacon = "beacon.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["model: real pretrained model integration tests (opt-in)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/beacon"]

[tool.ruff.format]
exclude = ["src/beacon/_vendor/**"]
