<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swarm Sight · reconstruction lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font:14px system-ui}header{padding:22px 28px;border-bottom:1px solid #282828;display:flex;align-items:center;gap:20px}h1{font-size:18px;margin:0}p{color:#aaa;margin:5px 0}main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#292929}.panel{background:#090909;min-width:0}.caption{padding:16px 24px}.viewer{height:70vh;min-height:400px;position:relative}.s3d-canvas,.s3d-labels{position:absolute;inset:0;width:100%;height:100%}.s3d-labels{pointer-events:none}.s3d-tools{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:2}button,a{font:inherit;color:#ddd;background:#191919;border:1px solid #444;border-radius:6px;padding:7px 10px;cursor:pointer;text-decoration:none}button:hover,button[aria-pressed=true]{background:#383838;color:#fff}#stats{padding:20px 28px;font:12px monospace;white-space:pre-wrap;color:#bbb}@media(max-width:800px){main{grid-template-columns:1fr}.viewer{height:55vh}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><header><div><h1>Swarm Sight / reconstruction lab</h1><p>The same 16 photographs. Original dots beside fused surfaces.</p></div><a href="/console">Open dashboard</a></header>
<main><section class="panel"><div class="caption"><b>Original point cloud</b><p>Branch geometry · 150k points · shared viewer</p></div><div id="before" class="viewer"></div></section><section class="panel"><div class="caption"><b>Fused room surface</b><p>Depth agreement · fused geometry · corrected color</p></div><div id="after" class="viewer"></div></section></main><div id="stats">Loading saved comparison…</div>
<script type="module">
import {createScene3D} from '/web/scene3d.js';
// Artifacts are local and ignored by git. Generate them with gpu/quality scripts.
try {
const root='/web/models/quality/';
const [baseline,surface]=await Promise.all(['baseline','surface'].map(n=>fetch(root+n+'.json').then(r=>{if(!r.ok)throw Error('Missing '+n+' artifact');return r.json()})));
const room={width:20,depth:15,stage:{width:8,depth:2.5},cameraFovDeg:55};
for(const [id,name,meta] of [['before','baseline',baseline],['after','surface',surface]]){
 const state={phones:[],scan:{enabled:true,last:{...meta,version:1,url:root+name+'.glb',transform:{scale:1,offset:[0,0,0]},alignment:{method:meta.leveledBy}}}};
 const view=createScene3D(document.getElementById(id),{room,getState:()=>state,getThumb:()=>null});view.show();
}
document.getElementById('stats').textContent=`Baseline: ${baseline.points.toLocaleString()} points · ${baseline.totalSeconds}s worker\nSurface: ${surface.points.toLocaleString()} vertices · ${surface.faces.toLocaleString()} triangles · ${surface.totalSeconds ?? surface.postprocessSeconds}s ${surface.totalSeconds ? 'worker' : 'geometry'} · ${surface.leveledBy} leveling${surface.bytes ? ' · '+(surface.bytes/1000).toFixed(0)+' KB' : ''}\nOrbit either view, scroll to zoom, or choose Top view / Cutaway. Scale remains relative until registered to the room.`;
} catch (error) {
 document.getElementById('stats').textContent=`Comparison unavailable: ${error.message}. Generate the local comparison artifacts using docs/3d-quality.md.`;
}
</script></body></html>
