<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swarm Sight · Command</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    :root {
      --bg: #05070f; --panel: #0b1020; --panel2: #0f1630; --line: rgba(255,255,255,0.08);
      --text: #e9edff; --muted: #7d86a8; --accent: #4cc9f0; --ok: #7ae582; --warn: #ffb703; --bad: #ff5d73;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
    button { font: inherit; color: inherit; cursor: pointer; }

    header { display: flex; align-items: center; gap: 18px; padding: 14px 20px; border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #0a1024, var(--bg)); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 0.14em; font-size: 15px; }
    .brand .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
    .brand .pulse.ok { background: var(--ok); box-shadow: 0 0 12px var(--ok); animation: blink 1.6s infinite; }
    @keyframes blink { 50% { opacity: 0.4; } }
    .stats { display: flex; gap: 10px; flex: 1; flex-wrap: wrap; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; min-width: 96px; }
    .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .stat span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
    .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; font-weight: 600; }
    .btn:hover { border-color: var(--accent); }
    .btn.on { background: var(--ok); color: #04210a; border-color: var(--ok); }
    .join { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 6px 10px 6px 6px; max-width: 360px; }
    .join img { width: 64px; height: 64px; border-radius: 6px; background: #fff; display: block; }
    .join input { background: transparent; border: 0; color: var(--text); font: 12px var(--mono); width: 230px; outline: none; }
    .join span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }

    main { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(320px, 1fr); gap: 14px; padding: 14px; min-height: 0; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; min-height: 0; display: flex; flex-direction: column; }
    .panel h2 { margin: 0; padding: 12px 14px; font-size: 12px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.12em; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }

    #feeds { flex: 1; overflow: auto; padding: 12px; display: grid; gap: 10px; align-content: start;
      grid-template-columns: repeat(auto-fill, minmax(var(--tile, 200px), 1fr)); }
    .tile { position: relative; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #000;
      border: 2px solid var(--line); cursor: pointer; transition: border-color 0.15s, transform 0.15s, opacity 0.3s;
      align-self: start; }
    .tile:hover, .tile.hl { border-color: var(--c); transform: translateY(-1px); }
    .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile .bar { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--c); }
    .tile .meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85)); display: flex; justify-content: space-between; align-items: end; gap: 6px; }
    .tile .who { font-weight: 800; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .who i { color: var(--c); font-style: normal; }
    .tile .nums { font: 11px var(--mono); color: #c9d0ee; white-space: nowrap; }
    .tile .tags { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
    .tag { font: 700 10px var(--mono); padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,0.6); color: var(--muted); }
    .tag.warn { color: var(--warn); } .tag.ok { color: var(--ok); } .tag.bad { color: var(--bad); }
    .tile.offline { opacity: 0.35; }
    .tile.flashing { animation: tflash 0.4s 3; }
    @keyframes tflash { 50% { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--c) 45%, transparent); } }
    .placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; }

    .empty { grid-column: 1 / -1; padding: 60px 20px; text-align: center; color: var(--muted); }
    .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }

    #mapWrap { position: relative; flex: 1; min-height: 0; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    .tabs { display: flex; gap: 4px; }
    .tab { background: transparent; border: 0; color: var(--muted); font: inherit; letter-spacing: inherit;
      text-transform: inherit; padding: 2px 8px; border-radius: 6px; }
    .tab.on { background: var(--panel2); color: var(--text); }
    .tools { display: flex; gap: 10px; align-items: center; }
    .mini { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px;
      font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--muted); }
    .mini:hover { color: var(--text); border-color: var(--accent); }
    #gpsMap { position: absolute; inset: 0; display: none; background: #0b1020; }
    #mapWrap.gps #gpsMap { display: block; }
    #mapWrap.gps #map { display: none; }
    .leaflet-container { font: 12px ui-sans-serif, system-ui; }
    .osm-dark { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.6); }
    .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px;
      border: 1px solid rgba(255,255,255,0.2); }
    #plog { border-top: 1px solid var(--line); padding: 8px 14px; font: 12px var(--mono); color: var(--muted);
      display: none; gap: 2px; max-height: 120px; overflow: hidden; }
    #plog.on { display: grid; }
    #plog b { font-weight: 700; }
    #plog time { opacity: 0.5; margin-right: 8px; }
    .legend { padding: 10px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }

    @media (max-width: 900px) {
      html, body { height: auto; }
      main { grid-template-columns: 1fr; grid-template-rows: 70vh 60vh; }
      header { flex-wrap: wrap; }
      .stats { order: 3; flex-basis: 100%; }
      .stat { flex: 1; min-width: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="pulse" id="pulse"></span>SWARM SIGHT</div>
    <div class="stats">
      <div class="stat"><b id="sLive">0</b><span>Phones live</span></div>
      <div class="stat"><b id="sPlaced">0</b><span>Placed on map</span></div>
      <div class="stat"><b id="sFps">0</b><span>Frames / sec in</span></div>
      <div class="stat"><b id="sLat">–</b><span>Median latency</span></div>
      <div class="stat"><b id="sSearched">0%</b><span>Area searched</span></div>
    </div>
    <button class="btn" id="plannerBtn" title="Assign sectors to phones and steer them there">Planner: off</button>
    <button class="btn" id="flashAll" title="Flash every phone's screen">Flash all</button>
    <div class="join">
      <img id="qr" alt="Join QR code">
      <div><span>Scan to join</span><input id="joinUrl" spellcheck="false" title="Edit to change the QR target (e.g. your tunnel URL)"></div>
    </div>
  </header>
  <main>
    <section class="panel">
      <h2><span>Live feeds</span><span id="feedCount">0</span></h2>
      <div id="feeds"></div>
    </section>
    <section class="panel">
      <h2>
        <span class="tabs"><button class="tab on" data-view="floor">Floor plan</button><button class="tab" data-view="gps">GPS</button></span>
        <span class="tools"><span id="roomName"></span><button class="mini" id="resetCov" title="Mark the whole room unsearched again">Reset coverage</button></span>
      </h2>
      <div id="mapWrap"><canvas id="map"></canvas><div id="gpsMap"></div></div>
      <div id="plog"></div>
      <div class="legend" id="legend"></div>
    </section>
  </main>
  <script type="module" src="/web/dashboard.js"></script>
</body>
</html>
